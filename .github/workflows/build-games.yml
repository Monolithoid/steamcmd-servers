name: Build game server images

on:
  push:
    branches: ["main"]
    paths:
      - "games/**"
      - "core/**"
      - ".github/workflows/build-games.yml"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "games/**"
      - "core/**"
      - ".github/workflows/build-games.yml"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:
    inputs:
      rebuild_reason:
        description: "Reason for manual rebuild"
        required: false
        default: "manual rebuild"

jobs:
  build-games:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game:
          - abioticfactor
          - assetto-corsa
          - rust
          - starrupture
          - subnautica-nitrox

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push game image
        uses: docker/build-push-action@v6
        with:
          context: ./games/${{ matrix.game }}
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          push: true
          tags: |
            monolithoid/${{ matrix.game }}-server:latest
