name: Build game images

on:
  push:
    paths:
      - 'games/**'
      - '.github/workflows/build-games.yml'
  pull_request:
    paths:
      - 'games/**'
      - '.github/workflows/build-games.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game:
          - valheim
          - project-zomboid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./games/${{ matrix.game }}
          push: false
