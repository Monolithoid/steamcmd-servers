name: Build core images

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "core/**"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:
    inputs:
      rebuild_reason:
        description: "Reason for manual rebuild"
        required: false
        default: "manual rebuild"

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: [linux, wine]

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push core image
        uses: docker/build-push-action@v6
        with:
          context: ./core/${{ matrix.core }}
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            monolithoid/steamcmd-${{ matrix.core }}-core:latest
