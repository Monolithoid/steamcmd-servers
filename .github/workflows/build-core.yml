name: Build core images

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "core/**"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:
    inputs:
      rebuild_reason:
        description: "Reason for manual rebuild"
        required: false
        default: "manual rebuild"

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: linux
            title: SteamCMD Linux core
            description: SteamCMD base image (Debian 12) for Linux dedicated game servers
          - core: wine
            title: SteamCMD Wine core
            description: SteamCMD + Wine base image (Debian 12) for Windows dedicated game servers

    env:
      IMAGE: monolithoid/steamcmd-${{ matrix.core }}-core
      IMAGE_DIR: core/${{ matrix.core }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.url=${{ env.REPO_URL }}/tree/${{ github.ref_name }}/${{ env.IMAGE_DIR }}
            org.opencontainers.image.documentation=${{ env.REPO_URL }}/blob/${{ github.ref_name }}/${{ env.IMAGE_DIR }}/README.md
            org.opencontainers.image.vendor=monolithoid

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push core image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.IMAGE_DIR }}
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Compose Docker Hub overview
        if: github.event_name != 'pull_request'
        run: |
          {
            cat "$IMAGE_DIR/README.md"
            echo
            echo "---"
            echo
            echo "## Links"
            echo
            echo "- Source of this image: [${IMAGE_DIR}](${REPO_URL}/tree/${GITHUB_REF_NAME}/${IMAGE_DIR})"
            echo "- Dockerfile: [${IMAGE_DIR}/Dockerfile](${REPO_URL}/blob/${GITHUB_REF_NAME}/${IMAGE_DIR}/Dockerfile)"
            echo "- Full project and the game server images built on it: [${GITHUB_REPOSITORY}](${REPO_URL})"
            echo "- Issues and suggestions: [GitHub issues](${REPO_URL}/issues)"
          } > "$RUNNER_TEMP/dockerhub-README.md"

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ runner.temp }}/dockerhub-README.md
