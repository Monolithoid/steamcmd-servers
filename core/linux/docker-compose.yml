version: "3.8"

services:
  steamcmd-linux-core:
    image: monolithoid/steamcmd-linux-core:latest
    container_name: steamcmd-linux-core
    restart: unless-stopped
    environment:
      STEAM_APP_ID: "000000"
      SERVER_CMD: "./server.sh"

      # Set to 0 to disable all SteamCMD update attempts at startup.
      STEAMCMD: "1"

      # Optional: needed for apps that require a non-anonymous login
      # STEAM_LOGIN: "my_steam_account"
      # STEAM_PASSWORD: "my_steam_password"
      # STEAM_BRANCH: "public"
      # STEAM_VALIDATE: "0"
    volumes:
      - ./data:/opt/server
    ports:
      - "27015:27015/udp"
