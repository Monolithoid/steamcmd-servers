version: "3.8"

services:
  steamcmd-wine-core:
    image: monolithoid/steamcmd-wine-core:latest
    container_name: steamcmd-wine-core
    restart: unless-stopped
    environment:
      SERVER_EXE: "Server.exe"
      SERVER_ARGS: ""
      START_SERVER: "1"
      ENABLE_TERMINAL: "0"
    volumes:
      - ./data:/opt/server
    ports:
      - "7777:7777/udp"
