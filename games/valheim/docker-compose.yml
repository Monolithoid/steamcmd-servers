version: "3.8"

services:
  valheim:
    image: monolithoid/valheim-server:latest
    container_name: valheim
    restart: unless-stopped
    environment:
      # Tu peux override si besoin
      # SERVER_CMD: >
      #   ./valheim_server.x86_64 -name "Mon serveur"
      #   -world "Monde1" -port 2456 -password "supersecret" -public 1
    volumes:
      - ./data:/opt/server
    ports:
      - "2456:2456/udp"
      - "2457:2457/udp"
