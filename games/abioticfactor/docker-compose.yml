version: "3.8"

services:
  abioticfactor:
    image: monolithoid/abioticfactor-server:latest
    container_name: abioticfactor
    restart: unless-stopped
    environment:
      # Optional: adjust to match your dedicated server executable
      SERVER_EXE: "AbioticFactorServer.exe"
      SERVER_ARGS: "-log -port=7777 -queryport=27015"
    volumes:
      - /opt/gaming/abioticfactor:/opt/server
    ports:
      - "7777:7777/udp"
      - "27015:27015/udp"
