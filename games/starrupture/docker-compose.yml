version: "3.8"

services:
  starrupture:
    image: monolithoid/starrupture-server:latest
    container_name: starrupture
    restart: unless-stopped
    environment:
      # Démarrage recommandé par la documentation officielle
      SERVER_EXE: "StarRuptureServerEOS.exe"
      SERVER_ARGS: "-Log -Port=7777 -RCWebControlDisable -RCWebInterfaceDisable"
    volumes:
      - ./data:/opt/server
    ports:
      - "7777:7777/udp"
