version: "3.8"

services:
  rust:
    image: monolithoid/rust-server:latest
    deploy:
      resources:
        limits:
          memory: 12G
    container_name: rust
    environment:
      ENABLE_TERMINAL: 0
      START_SERVER: 1
      STEAMCMD: 0
      # Optional: needed if the Steam app requires a non-anonymous login
      # STEAM_LOGIN: "my_steam_account"
      # STEAM_PASSWORD: "my_steam_password"

      # Example override:
      # SERVER_CMD: >
      #   ./RustDedicated -batchmode -nographics
      #   +server.port 28015
      #   +server.queryport 28017
      #   +rcon.password "supersecret"
      #   +rcon.port 28016
      #   +rcon.web 1
      #   +server.level "Procedural Map"
      #   +server.seed 12345
      #   +server.worldsize 3500
      #   +server.maxplayers 4
      #   +server.hostname "Monolithoid Rust"
      #   +server.description "Rust server powered by SteamCMD"
      #   +server.identity "rust-server"
      #   +server.saveinterval 600
    volumes:
      - /opt/gaming/rust:/opt/server
    ports:
      - "28015:28015/udp"
      - "28016:28016/udp"
      - "28017:28017/tcp"
