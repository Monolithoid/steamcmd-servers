version: "3.8"

services:
  assetto-corsa:
    image: monolithoid/assetto-corsa-server:latest
    container_name: assetto-corsa
    restart: unless-stopped
    environment:
      SERVER_ARGS: ""
    volumes:
      - /opt/gaming/assetto-corsa:/opt/server
    ports:
      - "9600:9600/tcp"
      - "9600:9600/udp"
      - "8081:8081/tcp"
